name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover --verbose
      - run: bandit --quiet --recursive bot main.py
      - run: pip-audit --requirement requirements.lock
